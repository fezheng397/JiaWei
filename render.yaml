services:
  - type: web
    name: recipes-api
    runtime: docker
    rootDir: recipes-api
    plan: starter
    autoDeploy: false
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_FLYWAY_ENABLED
        value: "false"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_STORAGE_BUCKET
        sync: false
      - key: APP_STORAGE_ENDPOINT
        sync: false
      - key: APP_STORAGE_REGION
        value: auto
      - key: APP_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: APP_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: APP_STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: APP_STORAGE_PRESIGN_EXPIRATION_MINUTES
        value: "15"
      - key: APP_STORAGE_MAX_UPLOAD_BYTES
        value: "10485760"
