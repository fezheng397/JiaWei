name: Backend CI

on:
  pull_request:
    paths:
      - "recipes-api/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "recipes-api/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipes-api
    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/recipes
      SPRING_DATASOURCE_USERNAME: recipes
      SPRING_DATASOURCE_PASSWORD: recipes
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: recipes
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: recipes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipes -d recipes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: recipes-api/pom.xml
      - name: Test API and production migrations
        run: mvn clean verify

  test-dev-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipes-api
    env:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/recipes
      SPRING_DATASOURCE_USERNAME: recipes
      SPRING_DATASOURCE_PASSWORD: recipes
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: recipes
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: recipes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipes -d recipes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: recipes-api/pom.xml
      - name: Test API and development migrations
        run: mvn clean verify
