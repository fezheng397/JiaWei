<main class="recipes-page">
  <header class="page-heading page-heading-with-action">
    <div>
      <h1 class="type-page-title">{{ pageTitle() }}</h1>
      <p class="description type-body-lg">{{ pageDescription() }}</p>
    </div>

    <app-chef-filter
      [chefs]="chefs"
      [selectedChef]="selectedChef()"
      (selectedChefChange)="selectedChef.set($event)"
    />
  </header>

  <nav class="content-tabs" aria-label="Recipe sections">
    <a
      class="type-tab"
      routerLink="/recipes"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Recipes ({{ filteredRecipes().length }})
    </a>
    <a
      class="type-tab"
      routerLink="/ingredients"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Ingredients ({{ filteredIngredientCount() }})
    </a>
  </nav>

  @if (recipeCards().length > 0) {
    <section class="recipe-grid" aria-label="Recipes">
      @for (card of recipeCards(); track card.route.join("/")) {
        <app-recipe-card [card]="card" />
      }
    </section>
  } @else {
    <section class="empty-state">
      <h2 class="type-card-title">No recipes found</h2>
      <p class="type-body">Try a different chef filter.</p>
    </section>
  }
</main>
