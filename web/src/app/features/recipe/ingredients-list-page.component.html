<main class="recipes-page">
  <header class="page-heading page-heading-with-action">
    <div>
      <h1 class="type-page-title">{{ pageTitle() }}</h1>
      <p class="description type-body-lg">{{ pageDescription() }}</p>
    </div>

    <app-chef-filter
      [chefs]="chefs()"
      [selectedChef]="selectedChef()"
      (selectedChefChange)="selectedChef.set($event)"
    />
  </header>

  <nav class="content-tabs" aria-label="Recipe sections">
    <a
      class="type-tab"
      routerLink="/recipes"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Recipes ({{ filteredRecipeCount() }})
    </a>
    <a
      class="type-tab"
      routerLink="/ingredients"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Ingredients ({{ filteredIngredients().length }})
    </a>
  </nav>

  <section class="ingredient-grid" aria-label="Ingredients">
    @for (card of ingredientCards(); track card.route.join("/")) {
      <app-recipe-card [card]="card" />
    } @empty {
      <section class="empty-state">
        <h2 class="type-card-title">No ingredients found</h2>
        <p class="type-body">Try a different chef filter.</p>
      </section>
    }
  </section>
</main>
